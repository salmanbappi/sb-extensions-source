ext {
    extName = 'Anikoto'
    extClass = '.Anikoto'
    themePkg = 'anikototheme'
    // Uses extensions-lib v17 APIs via the theme (memo/related/combined-update).
    libVersion = 17
    overrideVersionCode = 59
}

apply from: "$rootDir/common.gradle"

android {
    defaultConfig {
        manifestPlaceholders.appName = "Anikoto"
    }
}
