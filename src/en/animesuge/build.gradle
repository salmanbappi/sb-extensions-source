ext {
    extName = 'AnimeSuge'
    extClass = '.AnimeSuge'
    themePkg = 'anikototheme'
    // Uses extensions-lib v17 APIs via the theme (memo/related/combined-update).
    libVersion = 17
    overrideVersionCode = 16
}

apply from: "$rootDir/common.gradle"

android {
    defaultConfig {
        manifestPlaceholders.appName = "AnimeSuge"
    }
}
