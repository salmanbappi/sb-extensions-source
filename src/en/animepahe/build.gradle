ext {
    extName = 'AnimePahe'
    extClass = '.AnimePahe'
    // Requires extensions-lib v17: the Hoster -> Video hand-off now uses `memo`
    // (Hoster.internalData / Video.internalData are @Deprecated(ERROR) in v17).
    libVersion = 17
    extVersionCode = 83
}

apply from: "$rootDir/common.gradle"

dependencies {
    implementation(project(":lib:playlist-utils"))
    implementation(project(":lib:vidhide-extractor"))
    implementation(project(":lib:voe-extractor"))
    implementation(project(":lib:unpacker"))
}
