ext {
    extName = 'AnimeSogo'
    extClass = '.AnimeSogo'
    themePkg = 'anikototheme'
    // Uses extensions-lib v17 APIs via the theme (memo/related/combined-update).
    libVersion = 17
    overrideVersionCode = 27
}

apply from: "$rootDir/common.gradle"

android {
    defaultConfig {
        manifestPlaceholders.appName = "AnimeSogo"
    }
}
