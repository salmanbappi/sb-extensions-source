name: Automated Repository Maintenance

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-maintain:
    name: Auto Maintenance & Extractor Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Maintenance Engine
        run: |
          python3 scripts/cli.py auto-maintain

      - name: Create Pull Request if Changes Found
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(auto-maintain): sync extractors and auto-fix dependencies"
          title: "🤖 Automated Repository Maintenance & Extractor Sync"
          body: |
            Automated maintenance run performed:
            - Synchronized shared `lib/` extractors from upstream repositories (`yuzono`/`keiyoushi`).
            - Audited and updated missing `build.gradle` extractor dependencies.
            - Validated static code rules across all extension modules.
          branch: "auto-maintenance"
          base: "master"
