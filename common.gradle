apply plugin: 'com.android.application'
apply plugin: 'kotlinx-serialization'

assert !ext.has("pkgNameSuffix")
// assert !ext.has("libVersion")

assert extName.chars().max().asInt < 0x180 : "Extension name should be romanized"

// Load local.properties for local development
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

Project theme = ext.has("themePkg") ? project(":lib-multisrc:$themePkg") : null
if (theme != null) evaluationDependsOn(theme.path)

android {
    compileSdk 34

    def pkgName = "eu.kanade.tachiyomi.animeextension.${project.parent.name}.${project.name}"
    namespace pkgName
    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ['src']
            kotlin.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    defaultConfig {
        minSdk 24
        targetSdk 34
        applicationId pkgName
        versionCode theme == null ? extVersionCode : theme.baseVersionCode + overrideVersionCode
        def libVersion = project.ext.find("libVersion") ?: "16"
        versionName "$libVersion.$versionCode"
        base {
            archivesName = "aniyomi-${project.parent.name}.${project.name}-v$versionName"
        }
        assert extClass.startsWith(".")
        manifestPlaceholders = [
                appName       : "Aniyomi: $extName",
                // Bare name for the modern 'aniyomix.name' key: the loader uses it
                // verbatim and does NOT strip the "Aniyomi: " prefix.
                extName       : extName,
                author        : "salmanbappi",
                extClass      : extClass,
                nsfw          : project.ext.find("isNsfw") ? 1 : 0,
                // Modern content rating: 0 = Safe, 1 = Mixed, 2 = NSFW.
                contentWarning: project.ext.find("isNsfw") ? 2 : 0,
                // Advertised extensions-lib version; per-module override: ext { libVersion = 17 }.
                extensionLib  : project.ext.find("libVersion") ?: "16",
        ]
        String baseUrl = project.ext.find("baseUrl") ?: ""
        if (theme != null && !baseUrl.isEmpty()) {
            def split = baseUrl.split("://")
            assert split.length == 2
            def path = split[1].split("/")
            manifestPlaceholders += [
                    SOURCEHOST  : path[0],
                    SOURCESCHEME: split[0],
            ]
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file("signingkey.jks")
            storePassword System.getenv("KEY_STORE_PASSWORD")
            keyAlias System.getenv("ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    dependenciesInfo {
        includeInApk = false
    }

    buildFeatures {
        // Disable unused AGP features
        aidl false
        renderScript false
        resValues false
        shaders false
        buildConfig true
    }

    buildTypes {
        all {
            buildConfigField "String", "MEGACLOUD_API", "\"${System.getenv("MEGACLOUD_API") ?: localProperties.getProperty("MEGACLOUD_API", "")}\""
            buildConfigField "String", "KISSKH_API", "\"${System.getenv("KISSKH_API") ?: localProperties.getProperty("KISSKH_API", "")}\""
            buildConfigField "String", "KISSKH_SUB_API", "\"${System.getenv("KISSKH_SUB_API") ?: localProperties.getProperty("KISSKH_SUB_API", "")}\""
            buildConfigField "String", "KAISVA", "\"${System.getenv("KAISVA") ?: localProperties.getProperty("KAISVA", "")}\""
            buildConfigField "String", "TMDB_API", "\"${System.getenv("TMDB_API") ?: localProperties.getProperty("TMDB_API", "")}\""
        }
    }

    packaging {
        resources.excludes.add("kotlin-tooling-metadata.json")
        resources.pickFirsts.add("META-INF/nanohttpd/default-mimetypes.properties")
        resources.excludes.add("META-INF/nanohttpd/**")
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
        compilerOptions {
            freeCompilerArgs.add("-opt-in=kotlinx.serialization.ExperimentalSerializationApi")
        }
    }

}

dependencies {
    if (theme != null) implementation(theme) // Overrides core launcher icons
    implementation(project(":core"))
    implementation(libs.commons.text)
    compileOnly(libs.bundles.common)
}

// NOTE: the former `kotlin-stdlib-jdk8:1.7.0 -> libs.versions.kotlin.version` force
// (a workaround for dev.datlag JsUnpacker) was removed: nothing in this repo depends
// on JsUnpacker any more, and `libs.versions.kotlin.version` is not a valid catalog
// accessor — the block would have thrown if the constraint had ever matched.

tasks.register("writeManifestFile") {
    doLast {
        def manifest = android.sourceSets.getByName("main").manifest
        if (!manifest.srcFile.exists()) {
            File tempFile = layout.buildDirectory.get().file("tempAndroidManifest.xml").getAsFile()
            if (!tempFile.exists()) {
                tempFile.withWriter {
                    it.write('<?xml version="1.0" encoding="utf-8"?>\n<manifest />\n')
                }
            }
            manifest.srcFile(tempFile.path)
        }
    }
}

preBuild.dependsOn(writeManifestFile)
